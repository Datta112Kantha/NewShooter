<!DOCTYPE html>
<html>
  <head>
    <title>iCloudShooter - Editor</title>
    <link rel="stylesheet" href="style/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  </head>
  <body>


    <div class="bd-masthead mb-3">
        <div class="container bd-gutter">
          <div align="center" class="pt-4 display-3 fw-bolder bg-light rounded-5 rounded-bottom-0">License Page</div>
          <div align="center" class=" py-4 bg-light rounded-5 rounded-top-0"><a style="text-decoration: none;" href=index.html>MailShooter - Home</a> / License</div>
        </div>
    </div>

      <div class="container bg-light rounded-5 my-4 p-5">
        <div class="row p-3">
          <div class="col">
              <div align="right" id="activation"><span style="border-radius: 10px; padding: 0px 9px; margin-right: 10px; background-color:red"></span> Not Activated </div>
          </div>
          <div class="col">
              <div align="left" id="daysLeft">  0 Days Left</div>
          </div>
        </div>

        <h4 class=" px-3 mt-4 ">User</h4>
        <input type="text" id="user" class="form-control mb-5 p-3 rounded-4" placeholder="user">

        <h4 class=" px-3 pt-8">Licence Key</h4>
        <input type="text" id="LncValue" class="form-control mb-3 p-3 rounded-4" placeholder="Key">
        <div class="text-warning text-center" id="displayError"></div>
        <br/>
        <div style="display: flex">
          <button style="width: 100%;" class="btn btn-sm btn-danger rounded-4 fs-4 py-2" id="lncBtn" >Activate</button>
          <button style="width: 100%;color: #f3fff3;background-color: green;" class="btn btn-sm btn-green rounded-4 fs-4 py-2" id="genlncBtn"  >Generate Licence</button>
        </div>
       

        <center><button class="btn btn-warning justify-content-center py-2 px-5  mt-3 rounded-4 " id="clearlnc">Clear License</button></center>

      </div>
    </div>


    <div align="center" class="container bg-light rounded-5 my-3 p-3">
        <a class=" btn btn-light rounded-4 me-3" href="/index.html"> <i class="bi bi-house"></i> Home</a>
         | 
        <a class=" btn btn-light rounded-4 ms-3" href="/editor.html"> <i class="bi bi-pencil-square"></i> Editor</a>
      </div>
  
    </body>


<script src="script/dist/bootstrap.bundle.min.js"></script>
<script src="script/dist/crypto-js.min.js"></script>
<script src="script/lnc.js"></script>
<script src="script/license.js"></script>
