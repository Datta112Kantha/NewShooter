<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var c = localStorage.getItem('color-scheme') || 'light dark';
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', c);
        var dark = c === 'dark' || (c === 'light dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <title>Custom Tag Manager · Bin4ry Relay</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    .tm-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tm-title { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: var(--text-strong); }
    .tm-sub { margin: 0; font-size: 13px; color: var(--text-muted); }
    .tm-stats { display: flex; gap: 10px; }
    .tm-stat { padding: 8px 14px; border-radius: 10px; background: var(--surface-alt); border: 1px solid var(--border); text-align: center; }
    .tm-stat strong { display: block; font-size: 18px; color: var(--primary); }
    .tm-stat span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .tm-create-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .tm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .tag-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tag-card__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tag-card__name { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 800; color: var(--primary); }
    .tag-card__chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .val-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size: 12px;
      font-weight: 600;
    }
    .val-chip button { border: none; background: transparent; color: inherit; cursor: pointer; font-weight: 800; padding: 0; }
    .tm-create-form { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: end; }
    @media (max-width: 900px) { .tm-create-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="/V3/">
      <span class="site-header__logo" aria-hidden="true">⚡</span>
      <span>Bin4ry - Relay</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a class="nav-pill" href="/V3/">RELAY</a>
      <a class="nav-pill" href="/gmass2">GMASS-2</a>
      <a class="nav-pill nav-pill--fast" href="/gmass4">GMASS-4 <span class="fast-badge">FASTEST</span></a>
      <a class="nav-pill is-active" href="/V3/tags/" aria-current="page">TAGS</a>
      <a class="nav-pill" href="/V3/files/">FILES</a>
      <a class="nav-pill nav-pill--danger" href="/logout">LOGOUT</a>
    </nav>
    <div class="site-header__utils">
      <button type="button" id="themeToggle" class="icon-btn" aria-label="Toggle theme" aria-pressed="false">
        <span data-icon="moon" aria-hidden="true">🌙</span>
        <span data-icon="sun" aria-hidden="true" style="display:none">☀</span>
      </button>
    </div>
  </header>

  <main>
    <section class="tm-header-card">
      <div>
        <h1 class="tm-title">Custom Tag Manager</h1>
        <p class="tm-sub">Create reusable sequential or random replacement tags usable in Relay &amp; GMASS campaigns.</p>
      </div>
      <div class="tm-stats">
        <div class="tm-stat"><strong id="statTagCount">0</strong><span>Tags</span></div>
        <div class="tm-stat"><strong id="statValueCount">0</strong><span>Values</span></div>
      </div>
    </section>

    <section class="tm-create-card" aria-labelledby="newTagHeading">
      <h2 id="newTagHeading" style="margin:0 0 12px;font-size:14px;font-weight:700">New custom tag</h2>
      <form id="createTagForm" class="tm-create-form">
        <div>
          <label for="newTagName" style="display:block;font-size:11.5px;font-weight:700;margin-bottom:4px">Tag name</label>
          <input id="newTagName" class="field-input" type="text" placeholder="e.g. status" required>
        </div>
        <div>
          <label for="newTagValues" style="display:block;font-size:11.5px;font-weight:700;margin-bottom:4px">Initial values (comma or newline separated)</label>
          <input id="newTagValues" class="field-input" type="text" placeholder="Completed, Pending, Approved" required>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap">
            <input id="newTagRandom" type="checkbox" checked> Random pick per email
          </label>
          <button type="reset" class="btn">Reset</button>
          <button type="submit" class="btn btn--primary">+ Add tag</button>
        </div>
      </form>
    </section>

    <search>
      <input id="tagSearchInput" class="field-input" type="search" placeholder="Search tags or values..." aria-label="Search custom tags">
    </search>

    <div id="tagsGrid" class="tm-grid"></div>
  </main>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>
  <script src="/js/common.js" defer></script>
  <script src="/js/tags.js" defer></script>
</body>
</html>
